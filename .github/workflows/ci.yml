name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches what pubspec.lock resolves against (Flutter 3.44.x ships Dart 3.12.2).
  # Bump alongside pubspec.lock and .metadata.
  FLUTTER_VERSION: "3.44.9"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Native-FFI suites (QuickJS via flutter_js) are tagged `ffi` and skipped
      # on the host runner; see dart_test.yaml. They run on-device instead.
      - run: flutter test --reporter expanded

  js-providers:
    name: JS providers (offline harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The provider .js files and their contract tests run on a plain Node
      # runtime — no Flutter needed. Network-dependent cases are gated behind
      # RUN_LIVE=1 and stay skipped here, so this job is hermetic: it proves
      # every provider parses and answers getInfo, and that the first-party
      # manifest only advertises files that actually load.
      - run: node --test js_harness/*.test.mjs

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Compiles Dart + native Android without signing. Firebase is applied
      # conditionally, so the absence of google-services.json is fine.
      - run: flutter build apk --debug

  build-ios:
    name: Build (iOS, no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
